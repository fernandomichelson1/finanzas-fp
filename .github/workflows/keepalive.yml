name: Keep Supabase awake

# Evita que los proyectos Supabase (plan Free) se pausen por inactividad.
# Los pausan tras ~7 días sin uso; acá los "tocamos" 2 veces por semana.
# Cada proyecto se activa solo si están cargados sus secrets (Settings → Secrets → Actions).

on:
  schedule:
    - cron: '0 8 * * 1,4' # lunes y jueves 08:00 UTC
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Finanzas F&P
        env:
          URL: ${{ secrets.SB_FINANZAS_URL }}
          KEY: ${{ secrets.SB_FINANZAS_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "Finanzas: sin secret, salteo"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/household_state?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Finanzas F&P → HTTP $code"

      - name: Graphink
        env:
          URL: ${{ secrets.SB_GRAPHINK_URL }}
          KEY: ${{ secrets.SB_GRAPHINK_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "Graphink: sin secret, salteo"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/" -H "apikey: $KEY")
          echo "Graphink → HTTP $code"

      - name: PaoFitness
        env:
          URL: ${{ secrets.SB_PAOFITNESS_URL }}
          KEY: ${{ secrets.SB_PAOFITNESS_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "PaoFitness: sin secret, salteo"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/" -H "apikey: $KEY")
          echo "PaoFitness → HTTP $code"
